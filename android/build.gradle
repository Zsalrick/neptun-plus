// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'com.google.gms:google-services:4.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Force a consistent JVM target (17) across every module. The background-runner plugin's Kotlin
// compiles at 17 while javac defaulted to 21 under JDK 21 → "Inconsistent JVM-target" build failure.
// Pinning both here keeps all plugin modules aligned regardless of the local JDK.
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
        project.tasks.configureEach { t ->
            if (t.class.name.contains('KotlinCompile')) {
                try { t.kotlinOptions { jvmTarget = "17" } } catch (ignored) {}
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
